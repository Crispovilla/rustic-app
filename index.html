<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rústica — taller de muebles artesanales en maderas nobles: mesas, sillas, armarios, estanterías y más."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar (evita destello blanco/oscuro)
      try {
        var guardado = localStorage.getItem('rustic-theme')
        var tema =
          guardado === 'dark' || guardado === 'light'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', tema)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <title>Rústica — Maderas Nobles y Muebles Artesanales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
